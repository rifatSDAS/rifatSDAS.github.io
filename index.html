<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dr. Kazi Rifat Ahmed | GeoAI & EO Platform Architect</title>
    <meta name="description" content="GeoAI & Earth Observation Platform Architect and Full Stack GeoAI Engineer specializing in satellite data services, cloud-native architecture, and Earth observation systems." />
    <link rel="icon" type="image/x-icon" href="./logo/icon.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ── CSS Variables (matching original theme) ── */
        :root {
            --color-bg: #0a0a0f;
            --color-text: #e8e8ed;
            --color-text-muted: #8a8a95;
            --color-accent: #00d4aa;
            --color-accent-secondary: #7c3aed;
            --font-display: 'Outfit', sans-serif;
            --font-mono: 'Space Mono', monospace;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: var(--font-display);
            overflow: hidden;
        }

        /* ── Star field ── */
        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            border-radius: 50%;
            background: #fff;
            animation: twinkle var(--dur) ease-in-out infinite alternate;
            opacity: 0;
        }
        @keyframes twinkle {
            from { opacity: 0;          transform: scale(0.8); }
            to   { opacity: var(--op);  transform: scale(1.2); }
        }

        /* ── Grid overlay ── */
        .grid-overlay {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,212,170,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,212,170,0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        /* ── Page centre layout ── */
        .stage {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 2rem;
            text-align: center;
        }

        /* ── Rocket scene ── */
        .rocket-scene {
            position: relative;
            width: 120px;
            height: 220px;
            margin-bottom: 2rem;
        }

        /* launch pad */
        .launch-pad {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 8px;
            background: linear-gradient(90deg, #555565, #888899, #555565);
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(120,120,140,0.4);
        }
        .launch-pad::before, .launch-pad::after {
            content: '';
            position: absolute;
            bottom: 8px;
            width: 4px;
            height: 24px;
            background: var(--color-text-muted);
            border-radius: 2px;
        }
        .launch-pad::before { left: 16px; }
        .launch-pad::after  { right: 16px; }

        /* rocket wrapper — animates upward */
        .rocket-wrapper {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            animation: launch 3s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
        }
        @keyframes launch {
            0%   { transform: translateX(-50%) translateY(0)      scale(1);    opacity: 1; }
            60%  { transform: translateX(-50%) translateY(-155px)  scale(0.9);  opacity: 1; }
            85%  { transform: translateX(-50%) translateY(-200px)  scale(0.75); opacity: 0; }
            86%  { transform: translateX(-50%) translateY(0)      scale(1);    opacity: 0; }
            100% { transform: translateX(-50%) translateY(0)      scale(1);    opacity: 1; }
        }

        /* SVG rocket */
        .rocket-svg {
            width: 56px;
            filter: drop-shadow(0 0 8px rgba(0,212,170,0.6));
        }

        /* exhaust flame */
        .flame {
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            animation: flicker 0.15s ease-in-out infinite alternate;
        }
        @keyframes flicker {
            from { transform: translateX(-50%) scaleY(1)   scaleX(1); }
            to   { transform: translateX(-50%) scaleY(1.3) scaleX(0.85); }
        }

        /* particles / smoke puffs */
        .particles {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 40px;
            pointer-events: none;
        }
        .puff {
            position: absolute;
            border-radius: 50%;
            background: rgba(251,146,60,0.6);
            animation: puff var(--pd) ease-out infinite;
            animation-delay: var(--delay);
            bottom: 0;
            left: 50%;
        }
        @keyframes puff {
            0%   { transform: translate(-50%, 0)  scale(0.2); opacity: 0.8; }
            100% { transform: translate(var(--tx), -30px) scale(1.8); opacity: 0; }
        }

        /* ── Text content ── */
        .visit-label {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--color-accent);
            margin-bottom: 0.75rem;
        }

        .visit-heading {
            font-size: clamp(1.25rem, 4vw, 2rem);
            font-weight: 600;
            color: var(--color-text);
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .visit-sub {
            font-size: 0.9rem;
            color: var(--color-text-muted);
            margin-bottom: 2rem;
            max-width: 360px;
        }

        .visit-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.85rem 2rem;
            background: transparent;
            border: 1px solid var(--color-accent);
            color: var(--color-accent);
            font-family: var(--font-mono);
            font-size: 0.9rem;
            text-decoration: none;
            border-radius: 4px;
            letter-spacing: 0.05em;
            transition: background 0.25s, color 0.25s, box-shadow 0.25s;
            position: relative;
            overflow: hidden;
            z-index: 0;
        }
        .visit-link::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--color-accent);
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: -1;
        }
        .visit-link:hover::before { transform: translateX(0); }
        .visit-link:hover {
            color: var(--color-bg);
            box-shadow: 0 0 24px rgba(0,212,170,0.4);
        }
        .visit-link .arrow {
            transition: transform 0.25s;
        }
        .visit-link:hover .arrow { transform: translateX(4px); }

        /* ── Gradient accent line ── */
        .accent-line {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, #00ff87, #00d4aa, #00a86b);
            border-radius: 2px;
            margin: 1.5rem auto 0;
        }

        /* ── Satellite flyby ── */
        .satellite {
            position: fixed;
            top: 8%;
            left: 0;
            z-index: 2;
            pointer-events: none;
            animation: flyby 12s linear infinite;
            filter: drop-shadow(0 0 6px rgba(245,200,66,0.5));
        }
        @keyframes flyby {
            0%   { transform: translateX(-120px) rotate(-8deg); opacity: 0; }
            5%   { opacity: 1; }
            95%  { opacity: 1; }
            100% { transform: translateX(calc(100vw + 120px)) rotate(-8deg); opacity: 0; }
        }
        /* signal pulse emanating from dish */
        .satellite-signal {
            position: absolute;
            top: 4px;
            left: -6px;
            width: 18px;
            height: 18px;
            border: 1.5px solid #f5c842;
            border-radius: 50%;
            opacity: 0;
            animation: signal 2s ease-out infinite;
        }
        .satellite-signal:nth-child(2) { animation-delay: 0.6s; }
        .satellite-signal:nth-child(3) { animation-delay: 1.2s; }
        @keyframes signal {
            0%   { transform: scale(0.3); opacity: 0.8; }
            100% { transform: scale(2);   opacity: 0; }
        }
    </style>
</head>

<body>

    <!-- Star field (generated by JS) -->
    <div class="stars" id="stars"></div>

    <!-- Grid overlay -->
    <div class="grid-overlay"></div>

    <!-- Satellite flyby -->
    <div class="satellite" style="width:90px;">
        <!-- Signal rings -->
        <div class="satellite-signal"></div>
        <div class="satellite-signal"></div>
        <div class="satellite-signal"></div>
        <svg viewBox="0 0 90 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="satBody" x1="0" y1="0" x2="90" y2="0" gradientUnits="userSpaceOnUse">
                    <stop offset="0%"  stop-color="#7a5c1a"/>
                    <stop offset="50%" stop-color="#c8942a"/>
                    <stop offset="100%" stop-color="#7a5c1a"/>
                </linearGradient>
                <linearGradient id="panelL" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
                    <stop offset="0%"  stop-color="#f5c842" stop-opacity="0.95"/>
                    <stop offset="100%" stop-color="#c87d12" stop-opacity="0.85"/>
                </linearGradient>
                <linearGradient id="panelR" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
                    <stop offset="0%"  stop-color="#c87d12" stop-opacity="0.85"/>
                    <stop offset="100%" stop-color="#f5c842" stop-opacity="0.95"/>
                </linearGradient>
            </defs>

            <!-- Left solar panel -->
            <rect x="0" y="13" width="26" height="14" rx="1.5" fill="url(#panelL)" stroke="rgba(245,200,66,0.6)" stroke-width="0.5"/>
            <!-- Panel grid lines -->
            <line x1="8"  y1="13" x2="8"  y2="27" stroke="rgba(0,0,0,0.3)" stroke-width="0.5"/>
            <line x1="16" y1="13" x2="16" y2="27" stroke="rgba(0,0,0,0.3)" stroke-width="0.5"/>
            <line x1="0"  y1="20" x2="26" y2="20" stroke="rgba(0,0,0,0.3)" stroke-width="0.5"/>

            <!-- Left arm -->  
            <rect x="26" y="19" width="8" height="2" rx="1" fill="#b8902a"/>

            <!-- Body -->
            <rect x="34" y="10" width="22" height="20" rx="3" fill="url(#satBody)" stroke="rgba(245,200,66,0.5)" stroke-width="0.75"/>
            <!-- Body detail stripe -->
            <rect x="34" y="18" width="22" height="4" rx="0" fill="rgba(245,200,66,0.12)"/>
            <!-- Antenna dish -->
            <ellipse cx="40" cy="10" rx="5" ry="3" fill="none" stroke="#f5c842" stroke-width="1"/>
            <line x1="40" y1="10" x2="40" y2="13" stroke="#f5c842" stroke-width="0.75"/>
            <!-- Status light -->
            <circle cx="51" cy="14" r="1.5" fill="#f5c842" opacity="0.9"/>

            <!-- Right arm -->
            <rect x="56" y="19" width="8" height="2" rx="1" fill="#b8902a"/>

            <!-- Right solar panel -->
            <rect x="64" y="13" width="26" height="14" rx="1.5" fill="url(#panelR)" stroke="rgba(245,200,66,0.6)" stroke-width="0.5"/>
            <!-- Panel grid lines -->
            <line x1="72" y1="13" x2="72" y2="27" stroke="rgba(0,0,0,0.3)" stroke-width="0.5"/>
            <line x1="80" y1="13" x2="80" y2="27" stroke="rgba(0,0,0,0.3)" stroke-width="0.5"/>
            <line x1="64" y1="20" x2="90" y2="20" stroke="rgba(0,0,0,0.3)" stroke-width="0.5"/>
        </svg>
    </div>

    <!-- Main stage -->
    <main class="stage">

        <!-- Rocket animation -->
        <div class="rocket-scene">

            <!-- Smoke puffs on the pad -->
            <div class="particles">
                <div class="puff" style="--pd:1.4s;--delay:0s;  --tx:-14px; width:14px;height:14px;"></div>
                <div class="puff" style="--pd:1.6s;--delay:0.3s;--tx: 10px; width:10px;height:10px;"></div>
                <div class="puff" style="--pd:1.2s;--delay:0.6s;--tx: -6px; width:12px;height:12px;"></div>
                <div class="puff" style="--pd:1.8s;--delay:0.1s;--tx:  16px; width:8px; height:8px;"></div>
            </div>

            <!-- Rocket body -->
            <div class="rocket-wrapper">

                <!-- Exhaust flame -->
                <svg class="flame" viewBox="0 0 20 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="flameGrad" x1="10" y1="0" x2="10" y2="30" gradientUnits="userSpaceOnUse">
                            <stop offset="0%"   stop-color="#00d4aa" stop-opacity="1"/>
                            <stop offset="50%"  stop-color="#f59e0b" stop-opacity="0.9"/>
                            <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
                        </linearGradient>
                    </defs>
                    <path d="M10 0 C6 8 2 14 4 22 C6 28 10 30 10 30 C10 30 14 28 16 22 C18 14 14 8 10 0Z" fill="url(#flameGrad)"/>
                </svg>

                <!-- Rocket SVG -->
                <svg class="rocket-svg" viewBox="0 0 56 90" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="bodyGrad" x1="0" y1="0" x2="56" y2="0" gradientUnits="userSpaceOnUse">
                            <stop offset="0%"   stop-color="#c8c8d0"/>
                            <stop offset="50%"  stop-color="#f0f0f5"/>
                            <stop offset="100%" stop-color="#c8c8d0"/>
                        </linearGradient>
                        <linearGradient id="noseGrad" x1="28" y1="0" x2="28" y2="28" gradientUnits="userSpaceOnUse">
                            <stop offset="0%"   stop-color="#ffffff"/>
                            <stop offset="100%" stop-color="#d0d0dc"/>
                        </linearGradient>
                        <linearGradient id="finGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse">
                            <stop offset="0%"   stop-color="#e0e0ea" stop-opacity="0.85"/>
                            <stop offset="100%" stop-color="#a0a0b8" stop-opacity="0.95"/>
                        </linearGradient>
                    </defs>

                    <!-- Left fin -->
                    <path d="M18 68 L8 82 L18 76 Z" fill="url(#finGrad)"/>
                    <!-- Right fin -->
                    <path d="M38 68 L48 82 L38 76 Z" fill="url(#finGrad)"/>

                    <!-- Body -->
                    <rect x="18" y="28" width="20" height="50" rx="2" fill="url(#bodyGrad)" stroke="rgba(220,220,235,0.5)" stroke-width="0.5"/>

                    <!-- Nose cone -->
                    <path d="M28 0 C22 8 18 18 18 28 L38 28 C38 18 34 8 28 0Z" fill="url(#noseGrad)"/>

                    <!-- Window -->
                    <circle cx="28" cy="46" r="6" fill="#1a1a2e" stroke="rgba(255,255,255,0.8)" stroke-width="1.5"/>
                    <circle cx="28" cy="46" r="3" fill="rgba(200,220,255,0.35)"/>

                    <!-- Accent stripe -->
                    <rect x="18" y="60" width="20" height="2" rx="1" fill="rgba(255,255,255,0.6)"/>

                    <!-- Nozzle -->
                    <path d="M22 78 L24 84 L32 84 L34 78 Z" fill="#888899" stroke="rgba(255,255,255,0.4)" stroke-width="0.5"/>
                </svg>

            </div>

            <!-- Launch pad -->
            <div class="launch-pad"></div>
        </div>

        <!-- Text -->
        <p class="visit-label">My website has moved</p>
        <h1 class="visit-heading">Visit My Website</h1>

        <a href="https://kazirifatahmed.com/" target="_blank" rel="noopener noreferrer" class="visit-link">
            <p>Dr. Kazi Rifat Ahmed</p>
            <span class="arrow">&rarr;</span>
        </a>

        <div class="accent-line"></div>
    </main>

    <script>
        // Generate randomised star field
        const container = document.getElementById('stars');
        for (let i = 0; i < 160; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            const size = Math.random() * 2.5 + 0.5;
            const op   = (Math.random() * 0.5 + 0.2).toFixed(2);
            const dur  = (Math.random() * 4 + 2).toFixed(1) + 's';
            Object.assign(s.style, {
                width:             size + 'px',
                height:            size + 'px',
                top:               (Math.random() * 100) + '%',
                left:              (Math.random() * 100) + '%',
                '--op':            op,
                '--dur':           dur,
                animationDelay:    (Math.random() * 5).toFixed(1) + 's'
            });
            container.appendChild(s);
        }
    </script>

</body>
</html>
